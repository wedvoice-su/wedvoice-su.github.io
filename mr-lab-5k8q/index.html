<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MR 바꾸기 시험</title>
<style>
  :root { --bg:#faf7f5; --card:#fff; --ink:#1f1a17; --sub:#6d635d; --line:#e7dfd9; --pink:#d94f7a; --pinkbg:#fdecf1; --ok:#2f7d4f; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .note { color:var(--sub); font-size:14px; margin:0 0 18px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 14px; }
  h2 { font-size:16px; margin:0 0 10px; }
  h2 b { display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--pink); color:#fff; font-size:13px; text-align:center; line-height:22px; margin-right:6px; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font:inherit; font-weight:700; background:var(--pink); color:#fff; cursor:pointer; }
  .btn.ghost { background:var(--pinkbg); color:var(--pink); }
  .btn:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .muted { color:var(--sub); font-size:14px; }
  .range { margin:6px 0 12px; }
  .range label { display:flex; justify-content:space-between; font-size:14px; color:var(--sub); }
  .range label strong { color:var(--ink); font-size:17px; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--pink); }
  .nudge { display:flex; gap:6px; margin-top:4px; }
  .nudge button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 0; font:inherit; font-size:14px; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--line); border-radius:12px; padding:12px; margin:0 0 8px; cursor:pointer; }
  .opt input { margin-top:4px; accent-color:var(--pink); }
  .opt.on { border-color:var(--pink); background:var(--pinkbg); }
  .opt span { display:block; font-weight:700; }
  .opt small { display:block; color:var(--sub); font-size:13px; }
  .check { display:flex; gap:8px; align-items:center; font-size:14px; margin:10px 0 0; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:12px 0 6px; }
  .bar div { height:100%; width:0; background:var(--pink); transition:width .2s; }
  #status { font-size:14px; color:var(--sub); min-height:22px; }
  audio { width:100%; margin:6px 0 2px; }
  .lbl { font-size:14px; font-weight:700; margin:12px 0 0; }
  .sum { background:var(--pinkbg); border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0 0; }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; background:#f3eeea; border-radius:10px; padding:10px; max-height:260px; overflow:auto; margin:8px 0; }
  .err { color:var(--bad); }
  a.dl { color:var(--pink); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>MR 바꾸기 시험</h1>
  <p class="note">시험용 페이지예요. 음원은 휴대폰 밖으로 나가지 않아요.</p>

  <section>
    <h2><b>1</b>음원 고르기</h2>
    <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav" hidden>
    <button class="btn ghost" id="pick">음원 파일 고르기</button>
    <p class="muted" id="fileinfo" style="margin:8px 0 0"></p>
  </section>

  <section id="s2" hidden>
    <h2><b>2</b>MR로 바꿀 구간</h2>
    <div class="range">
      <label>시작 <strong id="aTxt">0:00.0</strong></label>
      <input type="range" id="a" min="0" step="0.5" value="0">
      <div class="nudge"><button data-k="a" data-d="-1">−1초</button><button data-k="a" data-d="-0.1">−0.1</button><button data-k="a" data-d="0.1">+0.1</button><button data-k="a" data-d="1">+1초</button></div>
    </div>
    <div class="range">
      <label>끝 (하이라이트 시작) <strong id="bTxt">0:30.0</strong></label>
      <input type="range" id="b" min="0" step="0.5" value="30">
      <div class="nudge"><button data-k="b" data-d="-1">−1초</button><button data-k="b" data-d="-0.1">−0.1</button><button data-k="b" data-d="0.1">+0.1</button><button data-k="b" data-d="1">+1초</button></div>
    </div>
    <button class="btn ghost" id="hear">원곡에서 이 구간 듣기</button>
    <audio id="orig" controls hidden></audio>
  </section>

  <section id="s3" hidden>
    <h2><b>3</b>바꾸는 방법</h2>
    <div id="opts"></div>
    <label class="check"><input type="checkbox" id="gpu" checked> 그래픽 칩(WebGPU) 쓰기 <span class="muted" id="gpuinfo"></span></label>
    <div style="height:12px"></div>
    <button class="btn" id="go">MR 만들기</button>
    <div class="bar" hidden><div></div></div>
    <p id="status" role="status"></p>
  </section>

  <section id="s4" hidden>
    <h2><b>4</b>들어 보기</h2>
    <p class="lbl">이어 듣기 <span class="muted">(구간 5초 전 → MR → 하이라이트 10초)</span></p>
    <audio id="joined" controls></audio>
    <p class="lbl">MR만</p>
    <audio id="mronly" controls></audio>
    <p class="sum" id="sum"></p>
    <a class="dl" id="dl" download>이어 듣기 파일 저장</a>
  </section>

  <section>
    <h2>저장한 AI 모델</h2>
    <p class="muted" style="margin:0 0 10px" id="saved">확인하는 중…</p>
    <button class="btn ghost" id="wipe" hidden>저장한 AI 모델 지우기</button>
  </section>

  <section>
    <h2>기록</h2>
    <p class="muted" style="margin:0">해 본 결과가 여기 쌓여요. 복사해서 보내 주세요.</p>
    <div id="log"></div>
    <button class="btn ghost" id="copy">기록 복사하기</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
